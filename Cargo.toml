[workspace]
members = [
    "crates/application",
    "crates/domain",
    "crates/infrastructure",
    "crates/interface", "crates/server",
]

resolver = "2"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
interface = { path = "crates/interface" }

chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.89"
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
tokio = { version = "1.52.3", features = ["full", "signal", "test-util"] }
serde_json = "1.0.149"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
tracing = "0.1.44"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Graduss"]
